<section class="manifesto relative py-28 sm:py-40" aria-label="ما الذي نقدمه">
  <div class="mx-auto max-w-6xl px-6">
    <p class="manifesto-kicker section-kicker"><span>—</span> فورتو</p>

    <p class="manifesto-text mt-8 max-w-5xl text-start font-extrabold">
      @for (w of words; track $index) {
        <span class="mw" [class.is-accent]="w.accent">{{ w.t }}</span>{{ ' ' }}
      }
    </p>

    <ul class="manifesto-facts mt-16 grid gap-px overflow-hidden rounded-3xl sm:grid-cols-3">
      @for (f of facts; track f.label) {
        <li class="fact">
          <span class="fact-value" dir="ltr">{{ f.value }}</span>
          <span class="fact-label">{{ f.label }}</span>
        </li>
      }
    </ul>
  </div>
</section>
