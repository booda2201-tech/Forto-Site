<section id="home" class="hero" aria-label="فورتو">
  <div class="hero-stage">
    <!-- 1. Video wall: three real clips from the centre, edge to edge -->
    <div class="wall" aria-hidden="true">
      @for (w of wall; track w.src; let i = $index) {
        <div class="wall-col wall-col-{{ i + 1 }}">
          <video class="wall-vid" [attr.data-src]="w.src" [attr.poster]="w.poster" loop playsinline preload="auto"></video>
        </div>
      }
    </div>

    <!-- 2. The wordmark is a window: video shows only through the letters -->
    <div class="mask" aria-hidden="true">
      <span class="mask-word" dir="ltr">
        @for (l of letters; track $index) {
          <span class="mask-ch"><span class="mask-ch-in">{{ l }}</span></span>
        }
        <!-- Same window as vector shapes: a dark plate with the letters punched out (no blend mode needed) -->
        <svg class="mask-vec" [attr.viewBox]="maskViewBox" preserveAspectRatio="none" focusable="false">
          <path [attr.d]="maskPath" fill-rule="evenodd" fill="#000" fill-opacity="0.918" />
        </svg>
      </span>
    </div>

    <span class="shade" aria-hidden="true"></span>
    <span class="grain" aria-hidden="true"></span>

    <!-- 3. Landing copy (exact brand headline) -->
    <div class="intro-copy">
      <p class="kicker" dir="ltr">
        <span class="kicker-bar"></span>
        <span>FORTO INTEGRATED CAR CENTER</span>
        <i>/</i>
        <span class="kicker-ar">الهرم، الجيزة</span>
      </p>

      <h1 class="headline">
        <span class="ln"><span class="ln-in">فورتو</span></span>
        <span class="sr-only"> - </span>
        <span class="ln"><span class="ln-in is-accent">عناية تليق بـ سيارتك</span></span>
      </h1>

      <p class="intro-sub">{{ description }}</p>

      <div class="intro-cta">
        <a [href]="bookingUrl" [appMagnetic]="0.3" target="_blank" rel="noopener noreferrer" class="btn-brand text-base" data-cursor="احجز">
          احجز موعدك الآن
          <svg class="h-5 w-5 rtl:-scale-x-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
        <a href="#services" class="btn-ghost text-base">أقسامنا</a>
      </div>
    </div>

    <!-- 4. Address and phone, always in reach -->
    <div class="hud">
      <a [href]="mapsUrl" target="_blank" rel="noopener noreferrer" class="hud-item hud-address" aria-label="افتح العنوان على خرائط جوجل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span>الطريق الدائري، الهرم</span>
      </a>

      <a href="#services" class="cue" aria-label="أقسام فورتو">
        <span class="cue-line"></span>
        أقسامنا
      </a>

      <a [href]="phoneHref" class="hud-item hud-phone" dir="ltr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
        </svg>
        <span>{{ phone }}</span>
      </a>
    </div>
  </div>
</section>
