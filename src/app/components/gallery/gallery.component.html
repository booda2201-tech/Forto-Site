<section class="relative py-12 sm:py-20">
  <div class="mx-auto max-w-6xl px-6">
    <header class="gallery-head text-start">
      <p class="section-kicker" data-aos="fade-up">{{ kicker }}</p>
      <h2 class="mt-5 t-h2 text-white">
        <span class="block overflow-hidden pb-4 pt-3 -mt-3">
          <span class="gallery-title-inner block">{{ titleLead }} <span class="text-brand-gradient">{{ titleAccent }}</span></span>
        </span>
      </h2>
    </header>

    <div class="gallery-grid mt-8 grid gap-4 sm:mt-12">
      @for (item of items; track item.image; let i = $index) {
        <figure class="gallery-tile glass-card group relative overflow-hidden rounded-3xl" data-aos="zoom-in" [attr.data-aos-delay]="i * 100">
          <img
            [src]="item.image"
            [alt]="item.title"
            [style.object-position]="item.focus"
            loading="lazy"
            decoding="async"
            class="tile-img absolute inset-0 h-full w-full object-cover"
          />
          <figcaption class="tile-caption absolute inset-x-0 bottom-0 p-5 text-start">
            <span class="block text-xs font-semibold text-brand-300">{{ item.category }}</span>
            <span class="mt-1 block text-base font-bold text-white">{{ item.title }}</span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
