<section id="reels" class="relative overflow-hidden py-28 sm:py-36">
  <div class="reels-glow pointer-events-none absolute" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-6xl px-6">
    <header class="reels-head flex flex-col gap-10 lg:flex-row lg:items-end lg:justify-between">
      <div class="text-start">
        <p class="section-kicker" data-aos="fade-up"><span>03</span> الفيديوهات</p>
        <h2 class="mt-5 t-h2 text-white">
          <span class="block overflow-hidden pb-4 pt-3 -mt-3">
            <span class="reels-title-inner block">شاهد <span class="text-brand-gradient">الشغل</span> بنفسك</span>
          </span>
        </h2>
      </div>

      <!-- Social proof -->
      <dl class="stats grid grid-cols-3 gap-2.5 sm:gap-6" data-aos="fade-up" data-aos-delay="150">
        @for (stat of stats; track stat.label) {
          <div class="stat glass-card items-center rounded-2xl px-2 py-4 text-center sm:items-stretch sm:px-6 sm:text-start">
            <dt class="order-2 mt-2 text-[0.72rem] leading-snug text-zinc-400 sm:mt-1 sm:text-xs">{{ stat.label }}</dt>
            <dd class="order-1 flex items-baseline justify-center gap-0.5 font-wordmark text-2xl font-bold text-white sm:justify-start sm:text-3xl" dir="ltr">
              <span class="stat-value" [attr.data-to]="stat.value" [attr.data-decimals]="stat.decimals">{{ stat.value }}</span>
              <span class="text-brand-500">{{ stat.suffix }}</span>
            </dd>
          </div>
        }
      </dl>
    </header>
  </div>

  <!-- Reel rail: full-bleed, drag / swipe to scroll -->
  <div class="reel-track mt-16 flex gap-5 overflow-x-auto pb-10 sm:gap-7" data-cursor="اسحب">
    @for (reel of reels; track reel.code; let i = $index) {
      <article
        class="reel-card relative aspect-[9/16] w-[15.5rem] flex-none overflow-hidden rounded-3xl sm:w-[17.5rem]"
        data-aos="fade"
        [attr.data-aos-delay]="i * 100"
      >
        <video
          class="reel-video"
          [attr.data-src]="reel.video"
          [poster]="reel.poster"
          [attr.aria-label]="reel.title"
          loop
          playsinline
          preload="none"
        ></video>
        <span class="reel-shade" aria-hidden="true"></span>
        <span class="reel-views">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <span dir="ltr">{{ reel.views }}</span>
        </span>
        <span class="reel-title">{{ reel.title }}</span>

        <!-- Whole card toggles sound -->
        <button type="button" class="reel-hit" data-cursor="صوت" [attr.aria-label]="'تشغيل / كتم الصوت: ' + reel.title"></button>
        <span class="reel-sound" aria-hidden="true">
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" /><path d="m22 9-6 6M16 9l6 6" /></svg>
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" /><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" /></svg>
        </span>
        <a class="reel-ig" [href]="'https://www.instagram.com/reel/' + reel.code + '/'" target="_blank" rel="noopener noreferrer" aria-label="فتح على إنستجرام" data-cursor="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" /></svg>
        </a>
        <span class="reel-progress" aria-hidden="true"><span class="reel-progress__bar"></span></span>
      </article>
    }

    <a [href]="instagram" target="_blank" rel="noopener noreferrer" class="reel-more flex-none" data-cursor="Instagram">
      <span class="reel-more__ring">
        <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" />
        </svg>
      </span>
      <span class="mt-5 text-base font-bold text-white">المزيد على إنستجرام</span>
      <span class="mt-1 text-sm text-zinc-500" dir="ltr">&#64;forto.car.care</span>
    </a>
  </div>
</section>
