<div class="dock" [class.is-on]="visible()" [attr.inert]="visible() ? null : ''" role="group" aria-label="حجز سريع">
  <a class="dock__book" [href]="bookUrl()" target="_blank" rel="noopener noreferrer" data-cursor="احجز">
    <span class="dock__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.9A8.5 8.5 0 1 1 8 19.4z" /><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-1.9-1-.9.7a3.5 3.5 0 0 1-1.7-1.7l.7-.9-1-1.9z" /></svg>
    </span>
    <span class="dock__text">
      <strong>احجز موعدك</strong>
      <small>{{ subtitle() }}</small>
    </span>
    <svg class="dock__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
  </a>

  <a class="dock__btn" [href]="phoneHref" aria-label="اتصل بنا" data-cursor="اتصل">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" /></svg>
  </a>

  <a class="dock__btn" [href]="mapsUrl" target="_blank" rel="noopener noreferrer" aria-label="افتح الموقع على الخريطة" data-cursor="الموقع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z" /><circle cx="12" cy="10" r="3" /></svg>
  </a>
</div>
